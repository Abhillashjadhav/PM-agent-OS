name: Public smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-quickstart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Run documented repository audit
        run: python3 tests/audit_repository.py

      - name: Run installer safety regressions
        run: python3 tests/test_install.py

      - name: Install into a clean Claude home
        run: |
          python3 scripts/install.py --target "$RUNNER_TEMP/claude-home"
          test -f "$RUNNER_TEMP/claude-home/skills/pm/SKILL.md"
          test -d "$RUNNER_TEMP/claude-home/agents"

      - name: Prove silent overwrite is blocked
        run: |
          if python3 scripts/install.py --target "$RUNNER_TEMP/claude-home"; then
            echo "installer unexpectedly overwrote existing entries"
            exit 1
          fi

      - name: Prove explicit replacement works
        run: |
          python3 scripts/install.py --target "$RUNNER_TEMP/claude-home" --force
          test -f "$RUNNER_TEMP/claude-home/skills/pm/SKILL.md"
