name: Current contract authoring

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  current-authoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install the existing reviewed publisher snapshot
        run: python -m pip install 'git+https://github.com/Abhillashjadhav/production-engineering-os.git@297a11d79e5d1e1eda1f8f94b7bec3046c41a0d6'
      - name: Check documented publisher provenance
        run: python scripts/check_handoff.py
      - name: Check documented-pin authoring and receipt-bound admission
        run: python -B tests/decision-to-contract/test_current_authoring.py -v
