name: Repository audit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run offline repository audit
        run: python tests/audit_repository.py
      - name: Reject planted validation failures
        run: python -m unittest discover -s tests -p test_validation_regressions.py -v
      - name: Lint all skills
        run: |
          while IFS= read -r skill; do
            python tests/lint_skill.py "$skill"
          done < <(find . -name SKILL.md -not -path './.git/*' -print)
      - name: Install pinned Production Engineering OS compiler
        run: python -m pip install "git+https://github.com/Abhillashjadhav/production-engineering-os.git@5c0f9e3a8f2c66b212c5e1adfb373e4fd2681bf9"
      - name: Preserve historical PMOS to PEOS intake compatibility
        run: python tests/decision-to-contract/validate_contract.py --legacy-intake
      - name: Compile Python checks
        run: python -m py_compile tests/audit_repository.py tests/lint_skill.py tests/pr_quality_gate.py tests/yaml.py tests/decision-to-contract/validate_contract.py tests/decision-to-contract/test_handoff.py tests/decision-to-contract/test_retained_inspection.py

  current-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact Production Engineering OS review snapshot
        run: python -m pip install "git+https://github.com/Abhillashjadhav/production-engineering-os.git@297a11d79e5d1e1eda1f8f94b7bec3046c41a0d6"
      - name: Verify current PMOS handoff and seeded failures
        run: python -m unittest discover -s tests/decision-to-contract -p 'test_*.py' -v
      - name: Retain TEST-ONLY current-run evidence
        run: python tests/decision-to-contract/validate_contract.py --evidence-dir "$RUNNER_TEMP/pmos-current-handoff-evidence"
      - name: Upload TEST-ONLY ledgers and fixtures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmos-current-handoff-test-only-evidence
          path: ${{ runner.temp }}/pmos-current-handoff-evidence/
          include-hidden-files: true
